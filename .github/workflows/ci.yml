name: CI

on:
  push:
    branches: ["003-platform", "main"]
  pull_request:
    branches: ["main"]

jobs:
  backend-test:
    name: Backend — Compile & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build & Test (with Testcontainers)
        working-directory: cbse-api
        run: mvn verify -B
        env:
          # Testcontainers starts real Docker containers automatically
          TESTCONTAINERS_REUSE_ENABLE: "false"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: cbse-api/target/surefire-reports/

  backend-docker:
    name: Backend — Docker Build & Push
    runs-on: ubuntu-latest
    needs: backend-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./cbse-api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/cbse-api:latest
            ghcr.io/${{ github.repository }}/cbse-api:${{ github.sha }}

  railway-deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: backend-docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service cbse-api --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
