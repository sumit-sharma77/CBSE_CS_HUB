<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CBSE CS Hub</title>
  <script type="text/javascript">
    // GitHub Pages SPA redirect: encode the path into a query param so the
    // index.html script can decode and restore it via History API.
    var segmentsToKeep = 1; // keep the /CBSE_CS_HUB repo prefix
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?p=/' +
      l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
